<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>地名ヘボン式タイピング v3</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/topojson-client@3"></script>
<style>
*{box-sizing:border-box;user-select:none}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:#0f172a;color:#fff}
.app{width:100%;height:100%;padding:10px;display:flex;flex-direction:column;gap:10px}
.header{height:45px;flex:none;display:flex;align-items:center;justify-content:space-between}
.title{font-size:18px;font-weight:800;color:#38bdf8}
.pause{border:0;border-radius:9px;padding:9px 16px;background:#f59e0b;color:#0f172a;font-weight:800;font-size:14px}
.main{min-height:0;flex:1;display:flex;flex-direction:column;gap:10px}
.game-card,.map-card{background:#1e293b;border:2px solid #334155;border-radius:16px;min-height:0}
.game-card{flex:1;display:flex;flex-direction:column;justify-content:space-around;align-items:center;text-align:center;padding:15px}
.kanji{font-size:clamp(30px,6vh,50px);font-weight:900;color:#facc15}
.kana{font-size:clamp(15px,3vh,22px);color:#94a3b8}
.roma{width:100%;font:800 clamp(21px,5vh,40px)/1.25 "Courier New",monospace;letter-spacing:2px;background:#0f172a;border:2px solid #38bdf8;border-radius:12px;padding:12px;min-height:72px;word-break:break-all}
.typed{color:#4ade80}.untyped{color:#fff}.mistyped{color:#f87171;text-decoration:underline}
.status{width:100%;display:flex;justify-content:space-around;font-size:clamp(16px,2.5vh,22px);font-weight:900;color:#cbd5e1}
.map-card{flex:1;background:#0f172a;border-color:#38bdf8;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.map-svg{width:100%;height:100%;display:block}
.map-bg{fill:#1e293b;stroke:#475569;stroke-width:.65}
.pref-border{fill:none;stroke:#38bdf8;stroke-width:1.5}
.muni-border{fill:none;stroke:#64748b;stroke-width:.45}
.highlight{fill:#334155!important;stroke:#38bdf8!important;stroke-width:2!important}
.map-label{fill:#94a3b8;font-size:12px;text-anchor:middle;pointer-events:none}
.pin{position:absolute;z-index:10;transform:translate(-50%,-50%);display:none;align-items:center;justify-content:center;pointer-events:none}
.pin-dot{width:13px;height:13px;background:#ef4444;border:2px solid #fff;border-radius:50%;box-shadow:0 0 12px #ef4444}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.98);z-index:100;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px}
.overlay h1{font-size:clamp(25px,5vw,38px);color:#38bdf8;text-align:center;margin:0 0 22px}
.mode-group{width:min(90vw,720px);display:flex;gap:18px}
.mode-btn{flex:1;padding:18px 14px;border:2px solid #38bdf8;border-radius:14px;background:#1e293b;color:#fff;font-size:clamp(16px,3vw,21px);font-weight:900}
.mode-btn.selected{background:#38bdf8;color:#0f172a}
.setting{margin:10px 0 24px;font-size:19px;font-weight:900;color:#cbd5e1}
.setting select{font-size:19px;font-weight:900;padding:9px 15px;border:2px solid #38bdf8;border-radius:9px;background:#0f172a;color:#fff}
.btns{display:flex;gap:14px}
.action{border:0;border-radius:12px;padding:13px 28px;font-size:18px;font-weight:900}
.blue{background:#38bdf8;color:#0f172a}.green{background:#4ade80;color:#0f172a}.red{background:#ef4444;color:#fff}
.result-box{text-align:center;color:#cbd5e1;font-size:20px;line-height:1.9;margin-bottom:20px}
.result-box strong{color:#facc15;font-size:32px}
.small{font-size:13px;color:#64748b;margin-top:8px}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-weight:700;z-index:2}
@media (min-aspect-ratio:1/1){.main{flex-direction:row}.mode-group{max-width:720px}}
@media (max-width:600px) and (orientation:portrait){.mode-group{flex-direction:column;max-width:360px}.mode-btn{padding:20px 10px}.game-card{padding:12px}.map-card{min-height:280px}.roma{min-height:76px}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title" id="mode-label">地名タイピング</div>
    <button class="pause" id="pause-btn" onclick="pauseGame()" style="display:none">⏸ 一時停止</button>
  </div>
  <div class="main">
    <section class="game-card">
      <div class="kanji" id="kanji">---</div>
      <div class="kana" id="kana">---</div>
      <div class="roma" id="roma">---</div>
      <div class="status">
        <div>スコア: <span id="score" style="color:#4ade80">0</span></div>
        <div>正解: <span id="correct" style="color:#38bdf8">0</span></div>
        <div>ミス: <span id="miss" style="color:#f87171">0</span></div>
        <div>残り: <span id="time" style="color:#facc15">60</span>s</div>
      </div>
    </section>
    <section class="map-card">
      <div class="loading" id="map-loading">地図を読み込んでいます…</div>
      <svg id="map" class="map-svg" viewBox="0 0 850 680" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="pin" id="pin"><div class="pin-dot"></div></div>
    </section>
  </div>
</div>

<div class="overlay" id="mode-overlay">
  <h1>モードを選択してください</h1>
  <div class="mode-group">
    <button class="mode-btn selected" id="aomori-btn" onclick="selectMode('aomori')">🍎 青森県40市町村</button>
    <button class="mode-btn" id="pref-btn" onclick="selectMode('pref')">🗾 47都道府県</button>
  </div>
</div>

<div class="overlay" id="start-overlay" style="display:none">
  <h1 id="start-title">🍎 青森県40市町村</h1>
  <div class="setting">⏱ 持ち時間：
    <select id="time-select"><option value="1">1 分</option><option value="2">2 分</option><option value="3">3 分</option><option value="5">5 分</option></select>
  </div>
  <div class="btns"><button class="action blue" onclick="backToMode()">戻る</button><button class="action green" onclick="startGame()">スタート！</button></div>
</div>

<div class="overlay" id="pause-overlay" style="display:none">
  <h1>⏸ 一時停止中</h1>
  <div class="btns"><button class="action green" onclick="resumeGame()">再開</button><button class="action red" onclick="showExitConfirm()">終了</button></div>
</div>

<div class="overlay" id="confirm-overlay" style="display:none">
  <h1>ゲームを終了しますか？</h1>
  <p style="color:#cbd5e1;margin-bottom:22px">現在の記録は終了します。</p>
  <div class="btns"><button class="action red" onclick="exitGame()">はい</button><button class="action blue" onclick="cancelExit()">いいえ</button></div>
</div>

<div class="overlay" id="result-overlay" style="display:none">
  <h1>🎉 ゲーム終了！</h1>
  <div class="result-box">
    スコア　<strong id="result-score">0</strong> 点<br>
    正解数　<span id="result-correct">0</span> 問<br>
    ミス　　<span id="result-miss">0</span> 回
  </div>
  <div class="btns"><button class="action blue" onclick="backToMode()">モード選択</button><button class="action green" onclick="restartGame()">もう一度</button></div>
</div>

<script>
const AOMORI=[
{k:"中泊町",y:"なかどまりまち",r:"nakadomari",id:"02387"},
{k:"青森市",y:"あおもりし",r:"aomori",id:"02201"},
{k:"弘前市",y:"ひろさきし",r:"hirosaki",id:"02202"},
{k:"八戸市",y:"はちのへし",r:"hachinohe",id:"02203"},
{k:"黒石市",y:"くろいしし",r:"kuroishi",id:"02204"},
{k:"五所川原市",y:"ごしょがわらし",r:"goshogawara",id:"02205"},
{k:"十和田市",y:"とわだし",r:"towada",id:"02206"},
{k:"三沢市",y:"みさわし",r:"misawa",id:"02207"},
{k:"むつ市",y:"むつし",r:"mutsu",id:"02208"},
{k:"つがる市",y:"つがるし",r:"tsugaru",id:"02209"},
{k:"平川市",y:"ひらかわし",r:"hirakawa",id:"02210"},
{k:"平内町",y:"ひらないまち",r:"hiranai",id:"02301"},
{k:"今別町",y:"いまべつまち",r:"imabetsu",id:"02303"},
{k:"蓬田村",y:"よもぎたむら",r:"yomogita",id:"02304"},
{k:"外ヶ浜町",y:"そとがはままち",r:"sotogahama",id:"02307"},
{k:"鰺ヶ沢町",y:"あじがさわまち",r:"ajigasawa",id:"02321"},
{k:"深浦町",y:"ふかうらまち",r:"fukaura",id:"02323"},
{k:"西目屋村",y:"にしめやむら",r:"nishimeya",id:"02343"},
{k:"藤崎町",y:"ふじさきまち",r:"fujisaki",id:"02361"},
{k:"大鰐町",y:"おおわにまち",r:"owani",id:"02362"},
{k:"田舎館村",y:"いなかだてむら",r:"inakadate",id:"02367"},
{k:"板柳町",y:"いたやなぎまち",r:"itayanagi",id:"02381"},
{k:"鶴田町",y:"つるたまち",r:"tsuruta",id:"02384"},
{k:"野辺地町",y:"のへじまち",r:"noheji",id:"02401"},
{k:"七戸町",y:"しちのへまち",r:"shichinohe",id:"02402"},
{k:"六戸町",y:"ろくのへまち",r:"rokunohe",id:"02405"},
{k:"横浜町",y:"よこはままち",r:"yokohama",id:"02406"},
{k:"東北町",y:"とうほくまち",r:"tohoku",id:"02408"},
{k:"六ヶ所村",y:"ろっかしょむら",r:"rokkasho",id:"02411"},
{k:"おいらせ町",y:"おいらせちょう",r:"oirase",id:"02412"},
{k:"大間町",y:"おおままち",r:"oma",id:"02423"},
{k:"東通村",y:"ひがしどおりむら",r:"higashidori",id:"02424"},
{k:"風間浦村",y:"かざまうらむら",r:"kazamaura",id:"02425"},
{k:"佐井村",y:"さいむら",r:"sai",id:"02426"},
{k:"三戸町",y:"さんのへまち",r:"sannohe",id:"02441"},
{k:"五戸町",y:"ごのへまち",r:"gonohe",id:"02442"},
{k:"田子町",y:"たっこまち",r:"takko",id:"02443"},
{k:"南部町",y:"なんぶちょう",r:"nanbu",id:"02445"},
{k:"階上町",y:"はしかみちょう",r:"hashikami",id:"02446"},
{k:"新郷村",y:"しんごうむら",r:"shingo",id:"02450"}
];

const PREF=[
["北海道","ほっかいどう","hokkaido","01"],["青森県","あおもりけん","aomori","02"],["岩手県","いわてけん","iwate","03"],["宮城県","みやぎけん","miyagi","04"],["秋田県","あきたけん","akita","05"],["山形県","やまがたけん","yamagata","06"],["福島県","ふくしまけん","fukushima","07"],["茨城県","いばらきけん","ibaraki","08"],["栃木県","とちぎけん","tochigi","09"],["群馬県","ぐんまけん","gunma","10"],["埼玉県","さいたまけん","saitama","11"],["千葉県","ちばけん","chiba","12"],["東京都","とうきょうと","tokyo","13"],["神奈川県","かながわけん","kanagawa","14"],["新潟県","にいがたけん","niigata","15"],["富山県","とやまけん","toyama","16"],["石川県","いしかわけん","ishikawa","17"],["福井県","ふくいけん","fukui","18"],["山梨県","やまなしけん","yamanashi","19"],["長野県","ながのけん","nagano","20"],["岐阜県","ぎふけん","gifu","21"],["静岡県","しずおかけん","shizuoka","22"],["愛知県","あいちけん","aichi","23"],["三重県","みえけん","mie","24"],["滋賀県","しがけん","shiga","25"],["京都府","きょうとふ","kyoto","26"],["大阪府","おおさかふ","osaka","27"],["兵庫県","ひょうごけん","hyogo","28"],["奈良県","ならけん","nara","29"],["和歌山県","わかやまけん","wakayama","30"],["鳥取県","とっとりけん","tottori","31"],["島根県","しまねけん","shimane","32"],["岡山県","おかやまけん","okayama","33"],["広島県","ひろしまけん","hiroshima","34"],["山口県","やまぐちけん","yamaguchi","35"],["徳島県","とくしまけん","tokushima","36"],["香川県","かがわけん","kagawa","37"],["愛媛県","えひめけん","ehime","38"],["高知県","こうちけん","kochi","39"],["福岡県","ふくおかけん","fukuoka","40"],["佐賀県","さがけん","saga","41"],["長崎県","ながさきけん","nagasaki","42"],["熊本県","くまもとけん","kumamoto","43"],["大分県","おおいたけん","oita","44"],["宮崎県","みやざきけん","miyazaki","45"],["鹿児島県","かごしまけん","kagoshima","46"],["沖縄県","おきなわけん","okinawa","47"]
].map(x=>({k:x[0],y:x[1],r:x[2],id:x[3]}));

/* 訓令式も正解にするための変換。
   表示はヘボン式。入力はヘボン式/訓令式のどちらでも可。 */
const HEPBURN_TO_KUNREI=[
[/shi/g,"si"],[/chi/g,"ti"],[/tsu/g,"tu"],[/fu/g,"hu"],
[/ji/g,"zi"],[/sha/g,"sya"],[/shu/g,"syu"],[/sho/g,"syo"],
[/cha/g,"tya"],[/chu/g,"tyu"],[/cho/g,"tyo"],[/ja/g,"zya"],[/ju/g,"zyu"],[/jo/g,"zyo"]
];
function acceptedSpellings(hep){
  const out=new Set([hep]);
  for(const [re,to] of HEPBURN_TO_KUNREI) out.add(hep.replace(re,to));
  return [...out];
}

let mode="aomori", list=[], current=null, typed="", score=0, correct=0, miss=0, timeLeft=60, timer=null, playing=false, paused=false;
let mapData=null, mapPath=null, currentFeature=null;

function selectMode(m){
  mode=m;
  document.getElementById("aomori-btn").classList.toggle("selected",m==="aomori");
  document.getElementById("pref-btn").classList.toggle("selected",m==="pref");
  document.getElementById("start-title").textContent=m==="aomori"?"🍎 青森県40市町村":"🗾 47都道府県";
  document.getElementById("mode-label").textContent=m==="aomori"?"🍎 青森県40市町村":"🗾 47都道府県";
  hideAllOverlays(); document.getElementById("start-overlay").style.display="flex";
  renderMap();
}
function backToMode(){
  playing=false; paused=false; clearInterval(timer);
  hideAllOverlays(); document.getElementById("mode-overlay").style.display="flex";
  document.getElementById("pause-btn").style.display="none";
  document.getElementById("pin").style.display="none";
}
function startGame(){
  timeLeft=Number(document.getElementById("time-select").value)*60;
  list=(mode==="aomori"?AOMORI:PREF).map(x=>({...x}));
  score=correct=miss=0; typed=""; playing=true; paused=false;
  document.getElementById("score").textContent=0;document.getElementById("correct").textContent=0;document.getElementById("miss").textContent=0;document.getElementById("time").textContent=timeLeft;
  hideAllOverlays();document.getElementById("pause-btn").style.display="block";
  nextQuestion(); startTimer();
}
function restartGame(){document.getElementById("result-overlay").style.display="none";startGame()}
function startTimer(){
  clearInterval(timer);
  timer=setInterval(()=>{if(!playing||paused)return;timeLeft--;document.getElementById("time").textContent=timeLeft;if(timeLeft<=0)endGame()},1000)
}
function pauseGame(){if(!playing||paused)return;paused=true;document.getElementById("pause-overlay").style.display="flex"}
function resumeGame(){paused=false;document.getElementById("pause-overlay").style.display="none"}
function showExitConfirm(){document.getElementById("pause-overlay").style.display="none";document.getElementById("confirm-overlay").style.display="flex"}
function cancelExit(){document.getElementById("confirm-overlay").style.display="none";document.getElementById("pause-overlay").style.display="flex"}
function exitGame(){playing=false;paused=false;clearInterval(timer);hideAllOverlays();document.getElementById("mode-overlay").style.display="flex";document.getElementById("pause-btn").style.display="none";document.getElementById("pin").style.display="none"}
function endGame(){
  playing=false;paused=false;clearInterval(timer);document.getElementById("pause-btn").style.display="none";document.getElementById("pin").style.display="none";
  document.getElementById("result-score").textContent=score;document.getElementById("result-correct").textContent=correct;document.getElementById("result-miss").textContent=miss;
  document.getElementById("result-overlay").style.display="flex";
}
function hideAllOverlays(){["mode-overlay","start-overlay","pause-overlay","confirm-overlay","result-overlay"].forEach(id=>document.getElementById(id).style.display="none")}

function nextQuestion(){
  if(!playing)return;
  if(!list.length) list=(mode==="aomori"?AOMORI:PREF).map(x=>({...x}));
  current=list.splice(Math.floor(Math.random()*list.length),1)[0];
  typed="";
  document.getElementById("kanji").textContent=current.k;
  document.getElementById("kana").textContent=current.y;
  renderRoma();
  renderMap(current.id);
}
function renderRoma(){
  const target=current.r;
  const typedHtml=typed.split("").map(c=>`<span class="typed">${escapeHtml(c)}</span>`).join("");
  const rest=target.slice(typed.length);
  document.getElementById("roma").innerHTML=typedHtml+`<span class="untyped">${escapeHtml(rest)}</span>`;
}
function showMistake(key){
  const target=current.r;
  const before=target.slice(0,typed.length);
  const rest=target.slice(typed.length);
  document.getElementById("roma").innerHTML=
    before.split("").map(c=>`<span class="typed">${escapeHtml(c)}</span>`).join("")+
    `<span class="mistyped">${escapeHtml(key)}</span>`+
    `<span class="untyped">${escapeHtml(rest)}</span>`;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

window.addEventListener("keydown",e=>{
  if(!playing||paused||!current)return;
  if(e.key.length!==1||!/^[a-z-]$/i.test(e.key))return;
  const key=e.key.toLowerCase();
  const candidates=acceptedSpellings(current.r);
  const possible=candidates.some(s=>s.startsWith(typed+key));
  if(possible){
    typed+=key;renderRoma();
    if(candidates.some(s=>s===typed)){score+=10;correct++;document.getElementById("score").textContent=score;document.getElementById("correct").textContent=correct;nextQuestion()}
  }else{
    miss++;document.getElementById("miss").textContent=miss;showMistake(key);
    setTimeout(()=>{if(playing&&!paused)renderRoma()},220);
  }
});

/* 地図 */
async function loadMap(){
  try{
    mapData=await d3.json("https://unpkg.com/jpn-atlas@1/japan/japan.json");
    renderMap();
    document.getElementById("map-loading").style.display="none";
  }catch(err){
    console.error(err);
    document.getElementById("map-loading").textContent="地図を読み込めませんでした";
  }
}
function renderMap(highlightId=null){
  if(!mapData)return;
  const svg=d3.select("#map");svg.selectAll("*").remove();
  mapPath=d3.geoPath();
  const prefFeatures=topojson.feature(mapData,mapData.objects.prefectures).features;
  const muniFeatures=topojson.feature(mapData,mapData.objects.municipalities).features;
  let visibleFeatures, baseFeatures;
  if(mode==="aomori"){
    visibleFeatures=muniFeatures.filter(f=>String(f.id).padStart(5,"0").slice(0,2)==="02");
    baseFeatures=visibleFeatures;
  }else{
    visibleFeatures=prefFeatures;
    baseFeatures=[topojson.feature(mapData,mapData.objects.country)];
  }
  const bounds=mapPath.bounds({type:"FeatureCollection",features:baseFeatures});
  const w=Math.max(1,bounds[1][0]-bounds[0][0]), h=Math.max(1,bounds[1][1]-bounds[0][1]);
  const padding=35;
  const scale=Math.min((850-padding*2)/w,(680-padding*2)/h);
  const tx=(850-scale*(bounds[0][0]+bounds[1][0]))/2;
  const ty=(680-scale*(bounds[0][1]+bounds[1][1]))/2;
  const group=svg.append("g").attr("transform",`translate(${tx},${ty}) scale(${scale})`);

  if(mode==="aomori"){
    group.selectAll("path.muni-fill").data(visibleFeatures).join("path")
      .attr("class","map-bg").attr("d",mapPath);
    const muniMesh=topojson.mesh(mapData,mapData.objects.municipalities,(a,b)=>a!==b && String(a.id).slice(0,2)===String(b.id).slice(0,2));
    group.append("path").datum(muniMesh).attr("class","muni-border").attr("d",mapPath);
    const pref02=prefFeatures.find(f=>String(f.id).padStart(2,"0")==="02");
    if(pref02) group.append("path").datum(pref02).attr("class","pref-border").attr("d",mapPath);
  }else{
    const root=topojson.feature(mapData,mapData.objects.country);
    group.append("path").datum(root).attr("class","map-bg").attr("d",mapPath);
    const prefMesh=topojson.mesh(mapData,mapData.objects.prefectures,(a,b)=>a!==b);
    group.append("path").datum(prefMesh).attr("class","pref-border").attr("d",mapPath);
  }

  currentFeature=null;
  if(highlightId){
    const id=String(highlightId).padStart(mode==="aomori"?5:2,"0");
    currentFeature=visibleFeatures.find(f=>String(f.id).padStart(mode==="aomori"?5:2,"0")===id);
    if(currentFeature){
      // 選択地域の塗りつぶしや矢印は使わず、赤い丸だけを表示。
      // 地図全体の縮尺に影響されないよう、丸のサイズを逆縮尺にする。
      const c=mapPath.centroid(currentFeature);
      const pin=group.append("g")
        .attr("class","pin-svg")
        .attr("transform",`translate(${c[0]},${c[1]}) scale(${1/scale})`);
      pin.append("circle")
        .attr("cx",0).attr("cy",0).attr("r",6)
        .attr("fill","#ef4444")
        .attr("stroke","#fff")
        .attr("stroke-width",2);
      pin.append("circle")
        .attr("cx",0).attr("cy",0).attr("r",10)
        .attr("fill","none")
        .attr("stroke","#ef4444")
        .attr("stroke-width",2)
        .attr("opacity",.25);
    }
  }
}

loadMap();
</script>
