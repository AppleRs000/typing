
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>地名ヘボン式タイピング・クイズ</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/topojson-client@3"></script>
<style>
*{box-sizing:border-box;user-select:none}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:#0f172a;color:#fff}
button{cursor:pointer}
.app{width:100%;height:100%;padding:10px;display:flex;flex-direction:column;gap:10px}
.header{height:45px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px}
.title{font-size:18px;font-weight:800;color:#38bdf8}
.header-right{display:flex;align-items:center;gap:8px}
.pause{border:0;border-radius:9px;padding:9px 16px;background:#f59e0b;color:#0f172a;font-weight:800;font-size:14px}
.main{min-height:0;flex:1;display:flex;flex-direction:column;gap:10px}
.game-card,.map-card{background:#1e293b;border:2px solid #334155;border-radius:16px;min-height:0}
.game-card{flex:1;display:flex;flex-direction:column;justify-content:space-around;align-items:center;text-align:center;padding:15px}
.kanji{font-size:clamp(30px,6vh,50px);font-weight:900;color:#facc15}
.kana{font-size:clamp(15px,3vh,22px);color:#94a3b8}
.roma{width:100%;font:800 clamp(21px,5vh,40px)/1.25 "Courier New",monospace;letter-spacing:2px;background:#0f172a;border:2px solid #38bdf8;border-radius:12px;padding:12px;min-height:72px;word-break:break-all}
.typed{color:#4ade80}.untyped{color:#fff}.mistyped{color:#f87171;text-decoration:underline}
.status{width:100%;display:flex;justify-content:space-around;gap:6px;font-size:clamp(14px,2.5vh,22px);font-weight:900;color:#cbd5e1}
.map-card{flex:1;background:#0f172a;border-color:#38bdf8;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.map-svg{width:100%;height:100%;display:block}
.map-bg{fill:#1e293b;stroke:#475569;stroke-width:.8px;vector-effect:non-scaling-stroke}
.pref-border{fill:none;stroke:#38bdf8;stroke-width:1.5px;vector-effect:non-scaling-stroke}
.muni-border{fill:none;stroke:#64748b;stroke-width:.8px;vector-effect:non-scaling-stroke}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.98);z-index:100;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px}
.overlay h1{font-size:clamp(25px,5vw,38px);color:#38bdf8;text-align:center;margin:0 0 22px}
.mode-group{width:min(90vw,720px);display:flex;gap:18px}
.mode-btn{flex:1;padding:18px 14px;border:2px solid #38bdf8;border-radius:14px;background:#1e293b;color:#fff;font-size:clamp(16px,3vw,21px);font-weight:900}
.mode-btn.selected{background:#38bdf8;color:#0f172a}
.setting{margin:10px 0 24px;font-size:19px;font-weight:900;color:#cbd5e1}
.setting select{font-size:19px;font-weight:900;padding:9px 15px;border:2px solid #38bdf8;border-radius:9px;background:#0f172a;color:#fff}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.action{border:0;border-radius:12px;padding:13px 28px;font-size:18px;font-weight:900}
.blue{background:#38bdf8;color:#0f172a}.green{background:#4ade80;color:#0f172a}.red{background:#ef4444;color:#fff}
.result-box{text-align:center;color:#cbd5e1;font-size:20px;line-height:1.9;margin-bottom:20px}
.result-box strong{color:#facc15;font-size:32px}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-weight:700;z-index:2}
.quiz-controls{display:none;position:absolute;z-index:5;top:10px;left:10px;right:10px;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none}
.quiz-controls>*{pointer-events:auto}
.hint-btn{border:2px solid #facc15;border-radius:10px;padding:10px 15px;background:#facc15;color:#0f172a;font-size:16px;font-weight:900;box-shadow:0 3px 10px #0005}
.quiz-status{background:#0f172aeF;border:1px solid #475569;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:900;line-height:1.7;color:#cbd5e1}
.quiz-status span{color:#facc15}
.quiz-bottom{display:none;position:absolute;z-index:5;bottom:10px;left:10px;right:10px;text-align:center;pointer-events:none}
.quiz-message{display:inline-block;background:#0f172aE8;border-radius:9px;padding:7px 12px;margin-bottom:8px;font-size:15px;font-weight:800;color:#fff}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:min(100%,650px);margin:auto;pointer-events:auto}
.choice-btn{min-height:48px;border:2px solid #38bdf8;border-radius:12px;background:#1e293bf2;color:#fff;font-size:clamp(15px,2.5vh,21px);font-weight:900;padding:9px 6px;box-shadow:0 3px 10px #0005}
.choice-btn:disabled{opacity:1}
.choice-btn.correct-answer{background:#166534;border-color:#4ade80;color:#fff}
.choice-btn.wrong-answer{background:#991b1b;border-color:#f87171;color:#fff}
.app.quiz-mode .main{flex-direction:column}
.app.quiz-mode .game-card{display:none}
.app.quiz-mode .map-card{flex:1;min-height:0}
.app.quiz-mode .quiz-controls{display:flex}
.app.quiz-mode .quiz-bottom{display:block}
.app.quiz-mode .title{font-size:16px}
@media (min-aspect-ratio:1/1){
  .main{flex-direction:row}
  .mode-group{max-width:720px}
  .app.quiz-mode .main{flex-direction:column}
}
@media (max-width:600px) and (orientation:portrait){
  .mode-group{flex-direction:column;max-width:360px}
  .mode-btn{padding:20px 10px}
  .game-card{padding:12px}
  .map-card{min-height:280px}
  .roma{min-height:76px}
  .app{padding:6px;gap:6px}
  .header{height:38px}
  .pause{padding:8px 10px}
  .quiz-controls{top:6px;left:6px;right:6px}
  .hint-btn{font-size:14px;padding:8px 10px}
  .quiz-status{font-size:12px;padding:6px 8px}
  .quiz-bottom{bottom:6px;left:6px;right:6px}
  .choices{gap:6px}
  .choice-btn{min-height:44px;padding:7px 4px;font-size:15px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div class="title" id="mode-label">地名タイピング</div>
    <div class="header-right">
      <button class="pause" id="pause-btn" onclick="pauseGame()" style="display:none">⏸ 一時停止</button>
    </div>
  </div>

  <div class="main">
    <section class="game-card">
      <div class="kanji" id="kanji">---</div>
      <div class="kana" id="kana">---</div>
      <div class="roma" id="roma">---</div>
      <div class="status">
        <div>スコア: <span id="score" style="color:#4ade80">0</span></div>
        <div>正解: <span id="correct" style="color:#38bdf8">0</span></div>
        <div>ミス: <span id="miss" style="color:#f87171">0</span></div>
        <div>残り: <span id="time" style="color:#facc15">60</span>s</div>
      </div>
    </section>

    <section class="map-card">
      <div class="loading" id="map-loading">地図を読み込んでいます…</div>
      <svg id="map" class="map-svg" viewBox="0 0 850 680" preserveAspectRatio="xMidYMid meet"></svg>

      <div class="quiz-controls" id="quiz-controls">
        <button class="hint-btn" id="hint-btn" onclick="toggleHint()">💡 ヒントオン</button>
        <div class="quiz-status">
          スコア <span id="q-score">0</span>　
          正解 <span id="q-correct">0</span>　
          ミス <span id="q-miss">0</span><br>
          残り <span id="q-time">60</span> 秒
        </div>
      </div>

      <div class="quiz-bottom" id="quiz-bottom">
        <div class="quiz-message" id="quiz-message">赤い丸の場所はどこかな？</div>
        <div class="choices" id="choices" style="display:none"></div>
      </div>
    </section>
  </div>
</div>

<!-- 1. 地域を選択 -->
<div class="overlay" id="mode-overlay">
  <h1>地域を選択してください</h1>
  <div class="mode-group">
    <button class="mode-btn selected" id="aomori-btn" onclick="selectMode('aomori')">🍎 青森県40市町村</button>
    <button class="mode-btn" id="pref-btn" onclick="selectMode('pref')">🗾 47都道府県</button>
  </div>
</div>

<!-- 2. ゲーム形式を選択 -->
<div class="overlay" id="type-overlay" style="display:none">
  <h1>ゲームを選択してください</h1>
  <div class="mode-group">
    <button class="mode-btn selected" id="typing-btn" onclick="selectGameType('typing')">⌨️ タイピング</button>
    <button class="mode-btn" id="quiz-btn" onclick="selectGameType('quiz')">🗺️ 地名クイズ</button>
  </div>
  <div class="btns" style="margin-top:24px">
    <button class="action blue" onclick="backToMode()">地域選択に戻る</button>
    <button class="action green" onclick="goToSettings()">次へ</button>
  </div>
</div>

<!-- 3. 制限時間を選択 -->
<div class="overlay" id="start-overlay" style="display:none">
  <h1 id="start-title">🍎 青森県40市町村</h1>
  <div id="selected-type" style="font-size:20px;font-weight:900;color:#4ade80;margin-bottom:8px">⌨️ タイピング</div>
  <div class="setting">⏱ 持ち時間：
    <select id="time-select">
      <option value="1">1 分</option>
      <option value="2">2 分</option>
      <option value="3">3 分</option>
      <option value="5">5 分</option>
    </select>
  </div>
  <div class="btns">
    <button class="action blue" onclick="backToType()">戻る</button>
    <button class="action green" onclick="startGame()">スタート！</button>
  </div>
</div>

<div class="overlay" id="pause-overlay" style="display:none">
  <h1>⏸ 一時停止中</h1>
  <div class="btns">
    <button class="action green" onclick="resumeGame()">再開</button>
    <button class="action red" onclick="showExitConfirm()">終了</button>
  </div>
</div>

<div class="overlay" id="confirm-overlay" style="display:none">
  <h1>ゲームを終了しますか？</h1>
  <p style="color:#cbd5e1;margin-bottom:22px">現在の記録は終了します。</p>
  <div class="btns">
    <button class="action red" onclick="exitGame()">はい</button>
    <button class="action blue" onclick="cancelExit()">いいえ</button>
  </div>
</div>

<div class="overlay" id="result-overlay" style="display:none">
  <h1>🎉 ゲーム終了！</h1>
  <div class="result-box">
    スコア　<strong id="result-score">0</strong> 点<br>
    正解数　<span id="result-correct">0</span> 問<br>
    ミス　　<span id="result-miss">0</span> 回
  </div>
  <div class="btns">
    <button class="action blue" onclick="backToMode()">地域選択</button>
    <button class="action green" onclick="restartGame()">もう一度</button>
  </div>
</div>

<script>

const PREF=[
["北海道","ほっかいどう","hokkaido","01"],["青森県","あおもりけん","aomori","02"],["岩手県","いわてけん","iwate","03"],["宮城県","みやぎけん","miyagi","04"],["秋田県","あきたけん","akita","05"],["山形県","やまがたけん","yamagata","06"],["福島県","ふくしまけん","fukushima","07"],["茨城県","いばらきけん","ibaraki","08"],["栃木県","とちぎけん","tochigi","09"],["群馬県","ぐんまけん","gunma","10"],["埼玉県","さいたまけん","saitama","11"],["千葉県","ちばけん","chiba","12"],["東京都","とうきょうと","tokyo","13"],["神奈川県","かながわけん","kanagawa","14"],["新潟県","にいがたけん","niigata","15"],["富山県","とやまけん","toyama","16"],["石川県","いしかわけん","ishikawa","17"],["福井県","ふくいけん","fukui","18"],["山梨県","やまなしけん","yamanashi","19"],["長野県","ながのけん","nagano","20"],["岐阜県","ぎふけん","gifu","21"],["静岡県","しずおかけん","shizuoka","22"],["愛知県","あいちけん","aichi","23"],["三重県","みえけん","mie","24"],["滋賀県","しがけん","shiga","25"],["京都府","きょうとふ","kyoto","26"],["大阪府","おおさかふ","osaka","27"],["兵庫県","ひょうごけん","hyogo","28"],["奈良県","ならけん","nara","29"],["和歌山県","わかやまけん","wakayama","30"],["鳥取県","とっとりけん","tottori","31"],["島根県","しまねけん","shimane","32"],["岡山県","おかやまけん","okayama","33"],["広島県","ひろしまけん","hiroshima","34"],["山口県","やまぐちけん","yamaguchi","35"],["徳島県","とくしまけん","tokushima","36"],["香川県","かがわけん","kagawa","37"],["愛媛県","えひめけん","ehime","38"],["高知県","こうちけん","kochi","39"],["福岡県","ふくおかけん","fukuoka","40"],["佐賀県","さがけん","saga","41"],["長崎県","ながさきけん","nagasaki","42"],["熊本県","くまもとけん","kumamoto","43"],["大分県","おおいたけん","oita","44"],["宮崎県","みやざきけん","miyazaki","45"],["鹿児島県","かごしまけん","kagoshima","46"],["沖縄県","おきなわけん","okinawa","47"]
].map(x=>({k:x[0],y:x[1],r:x[2],id:x[3]}));

/* ヘボン式・訓令式の両方を正解にする */
const KUNREI_TOKEN=/(shi|chi|tsu|fu|ji|sha|shu|sho|cha|chu|cho|ja|ju|jo)/;
const KUNREI_MAP={shi:"si",chi:"ti",tsu:"tu",fu:"hu",ji:"zi",sha:"sya",shu:"syu",sho:"syo",cha:"tya",chu:"tyu",cho:"tyo",ja:"zya",ju:"zyu",jo:"zyo"};
const spellCache=new Map();

function acceptedSpellings(hep){
  if(spellCache.has(hep))return spellCache.get(hep);
  let out=[""];
  for(const part of hep.split(KUNREI_TOKEN)){
    const alts=Object.prototype.hasOwnProperty.call(KUNREI_MAP,part)?[part,KUNREI_MAP[part]]:[part];
    out=out.flatMap(s=>alts.map(a=>s+a));
  }
  const list=[...new Set(out)];
  spellCache.set(hep,list);
  return list;
}
function pickSpelling(hep,typed){
  return acceptedSpellings(hep).find(s=>s.startsWith(typed))||hep;
}

/* 地図用の幾何計算 */
function polygonsOf(f){
  const g=f&&f.geometry;
  if(!g)return [];
  if(g.type==="Polygon")return [g.coordinates];
  if(g.type==="MultiPolygon")return g.coordinates;
  return [];
}
function ringArea(r){
  let s=0;
  for(let i=0,j=r.length-1;i<r.length;j=i++)s+=(r[j][0]+r[i][0])*(r[j][1]-r[i][1]);
  return Math.abs(s/2);
}
function polygonArea(poly){
  let a=ringArea(poly[0]);
  for(let i=1;i<poly.length;i++)a-=ringArea(poly[i]);
  return a;
}
function segDistSq(px,py,a,b){
  let x=a[0],y=a[1],dx=b[0]-x,dy=b[1]-y;
  if(dx!==0||dy!==0){
    const t=((px-x)*dx+(py-y)*dy)/(dx*dx+dy*dy);
    if(t>1){x=b[0];y=b[1]}
    else if(t>0){x+=dx*t;y+=dy*t}
  }
  dx=px-x;dy=py-y;
  return dx*dx+dy*dy;
}
function pointToPolygonDist(px,py,poly){
  let inside=false,minSq=Infinity;
  for(const ring of poly){
    for(let i=0,j=ring.length-1;i<ring.length;j=i++){
      const a=ring[i],b=ring[j];
      if((a[1]>py)!==(b[1]>py)&&px<(b[0]-a[0])*(py-a[1])/(b[1]-a[1])+a[0])inside=!inside;
      const d=segDistSq(px,py,a,b);
      if(d<minSq)minSq=d;
    }
  }
  return (inside?1:-1)*Math.sqrt(minSq);
}
function polylabel(poly,precision){
  const outer=poly[0];
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const p of outer){
    if(p[0]<minX)minX=p[0];
    if(p[1]<minY)minY=p[1];
    if(p[0]>maxX)maxX=p[0];
    if(p[1]>maxY)maxY=p[1];
  }
  const cell=Math.min(maxX-minX,maxY-minY);
  if(!(cell>0))return [(minX+maxX)/2,(minY+maxY)/2];
  const mk=(x,y,h)=>{const d=pointToPolygonDist(x,y,poly);return{x,y,h,d,max:d+h*Math.SQRT2}};
  let half=cell/2;
  const queue=[];
  for(let x=minX;x<maxX;x+=cell)for(let y=minY;y<maxY;y+=cell)queue.push(mk(x+half,y+half,half));
  let best=mk((minX+maxX)/2,(minY+maxY)/2,0);
  let guard=0;
  while(queue.length&&guard++<20000){
    let bi=0;
    for(let i=1;i<queue.length;i++)if(queue[i].max>queue[bi].max)bi=i;
    const c=queue.splice(bi,1)[0];
    if(c.d>best.d)best=c;
    if(c.max-best.d<=precision)continue;
    half=c.h/2;
    queue.push(mk(c.x-half,c.y-half,half),mk(c.x+half,c.y-half,half),mk(c.x-half,c.y+half,half),mk(c.x+half,c.y+half,half));
  }
  return [best.x,best.y];
}
function pinPointOf(features,precision){
  const polys=features.flatMap(polygonsOf);
  if(!polys.length)return null;
  let best=polys[0],bestA=-1;
  for(const p of polys){const a=polygonArea(p);if(a>bestA){best=p;bestA=a}}
  return polylabel(best,precision);
}

/* ゲーム状態 */
let mode="aomori";
let gameType="typing";
let list=[],current=null,typed="";
let score=0,correct=0,miss=0,timeLeft=60,timer=null;
let playing=false,paused=false;
let hintOn=false,quizOptions=[],quizAnswered=false,answerDelay=null;
let mapData=null;

function selectMode(m){
  mode=m;
  document.getElementById("aomori-btn").classList.toggle("selected",m==="aomori");
  document.getElementById("pref-btn").classList.toggle("selected",m==="pref");
  renderMap();
  hideAllOverlays();
  document.getElementById("type-overlay").style.display="flex";
}
function selectGameType(t){
  gameType=t;
  document.getElementById("typing-btn").classList.toggle("selected",t==="typing");
  document.getElementById("quiz-btn").classList.toggle("selected",t==="quiz");
}
function goToSettings(){
  document.getElementById("start-title").textContent=mode==="aomori"?"🍎 青森県40市町村":"🗾 47都道府県";
  document.getElementById("selected-type").textContent=gameType==="typing"?"⌨️ タイピング":"🗺️ 地名クイズ";
  hideAllOverlays();
  document.getElementById("start-overlay").style.display="flex";
}
function backToType(){
  hideAllOverlays();
  document.getElementById("type-overlay").style.display="flex";
}
function backToMode(){
  playing=false;paused=false;clearInterval(timer);clearTimeout(answerDelay);
  hideAllOverlays();
  document.getElementById("mode-overlay").style.display="flex";
  document.getElementById("pause-btn").style.display="none";
  document.getElementById("app").classList.remove("quiz-mode");
  clearPin();
}
function startGame(){
  clearTimeout(answerDelay);
  timeLeft=Number(document.getElementById("time-select").value)*60;
  list=(mode==="aomori"?AOMORI:PREF).map(x=>({...x}));
  score=correct=miss=0;typed="";playing=true;paused=false;
  hintOn=false;quizAnswered=false;quizOptions=[];
  document.getElementById("app").classList.toggle("quiz-mode",gameType==="quiz");
  document.getElementById("mode-label").textContent=
    (mode==="aomori"?"🍎 青森県40市町村":"🗾 47都道府県")+
    (gameType==="quiz"?"・クイズ":"・タイピング");
  updateStatus();
  document.getElementById("pause-btn").style.display="block";
  document.getElementById("hint-btn").textContent="💡 ヒントオン";
  document.getElementById("choices").style.display="none";
  document.getElementById("quiz-message").textContent="赤い丸の場所はどこかな？";
  hideAllOverlays();
  nextQuestion();
  startTimer();
}
function restartGame(){
  document.getElementById("result-overlay").style.display="none";
  startGame();
}
function updateStatus(){
  document.getElementById("score").textContent=score;
  document.getElementById("correct").textContent=correct;
  document.getElementById("miss").textContent=miss;
  document.getElementById("time").textContent=timeLeft;
  document.getElementById("q-score").textContent=score;
  document.getElementById("q-correct").textContent=correct;
  document.getElementById("q-miss").textContent=miss;
  document.getElementById("q-time").textContent=timeLeft;
}
function startTimer(){
  clearInterval(timer);
  timer=setInterval(()=>{
    if(!playing||paused)return;
    timeLeft--;
    updateStatus();
    if(timeLeft<=0)endGame();
  },1000);
}
function pauseGame(){
  if(!playing||paused)return;
  paused=true;
  document.getElementById("pause-overlay").style.display="flex";
}
function resumeGame(){
  paused=false;
  document.getElementById("pause-overlay").style.display="none";
}
function showExitConfirm(){
  document.getElementById("pause-overlay").style.display="none";
  document.getElementById("confirm-overlay").style.display="flex";
}
function cancelExit(){
  document.getElementById("confirm-overlay").style.display="none";
  document.getElementById("pause-overlay").style.display="flex";
}
function exitGame(){
  playing=false;paused=false;
  clearInterval(timer);clearTimeout(answerDelay);
  hideAllOverlays();
  document.getElementById("mode-overlay").style.display="flex";
  document.getElementById("pause-btn").style.display="none";
  document.getElementById("app").classList.remove("quiz-mode");
  clearPin();
}
function endGame(){
  playing=false;paused=false;
  clearInterval(timer);clearTimeout(answerDelay);
  document.getElementById("pause-btn").style.display="none";
  clearPin();
  document.getElementById("result-score").textContent=score;
  document.getElementById("result-correct").textContent=correct;
  document.getElementById("result-miss").textContent=miss;
  document.getElementById("result-overlay").style.display="flex";
}
function hideAllOverlays(){
  ["mode-overlay","type-overlay","start-overlay","pause-overlay","confirm-overlay","result-overlay"].forEach(id=>{
    document.getElementById(id).style.display="none";
  });
}

/* 出題 */
function nextQuestion(){
  if(!playing)return;
  clearTimeout(answerDelay);
  if(!list.length)list=(mode==="aomori"?AOMORI:PREF).map(x=>({...x}));
  current=list.splice(Math.floor(Math.random()*list.length),1)[0];
  typed="";quizAnswered=false;
  renderMap(current.id);

  if(gameType==="typing"){
    document.getElementById("kanji").textContent=current.k;
    document.getElementById("kana").textContent=current.y;
    renderRoma();
  }else{
    document.getElementById("kanji").textContent="---";
    document.getElementById("kana").textContent="赤い丸の場所を当てよう！";
    document.getElementById("roma").textContent="地図をよく見よう";
    makeQuizOptions();
    renderChoices();
    document.getElementById("quiz-message").textContent="赤い丸の場所はどこかな？";
  }
}

/* クイズの4択を作る */
function makeQuizOptions(){
  const source=mode==="aomori"?AOMORI:PREF;
  const wrong=source.filter(x=>x.id!==current.id);
  for(let i=wrong.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [wrong[i],wrong[j]]=[wrong[j],wrong[i]];
  }
  quizOptions=[current,...wrong.slice(0,3)];
  for(let i=quizOptions.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [quizOptions[i],quizOptions[j]]=[quizOptions[j],quizOptions[i]];
  }
}
function renderChoices(){
  const box=document.getElementById("choices");
  box.innerHTML="";
  quizOptions.forEach(item=>{
    const btn=document.createElement("button");
    btn.className="choice-btn";
    btn.textContent=item.k;
    btn.onclick=()=>answerQuiz(item,btn);
    box.appendChild(btn);
  });
  box.style.display=hintOn?"grid":"none";
}
function toggleHint(){
  if(!playing||gameType!=="quiz")return;
  hintOn=!hintOn;
  document.getElementById("hint-btn").textContent=hintOn?"💡 ヒントオフ":"💡 ヒントオン";
  renderChoices();
  if(hintOn&&!quizAnswered){
    document.getElementById("quiz-message").textContent="4つの中から選ぼう！";
  }else if(!hintOn&&!quizAnswered){
    document.getElementById("quiz-message").textContent="赤い丸の場所を考えよう。答えるときはヒントオン！";
  }
}
function answerQuiz(item,btn){
  if(!playing||paused||quizAnswered)return;
  quizAnswered=true;
  const buttons=document.querySelectorAll(".choice-btn");
  buttons.forEach(b=>{
    b.disabled=true;
    const option=quizOptions.find(x=>x.k===b.textContent);
    if(option&&option.id===current.id)b.classList.add("correct-answer");
  });

  if(item.id===current.id){
    score+=10;correct++;
    document.getElementById("quiz-message").textContent="⭕ 正解！「"+current.k+"」";
  }else{
    miss++;
    btn.classList.add("wrong-answer");
    document.getElementById("quiz-message").textContent="❌ 正解は「"+current.k+"」";
  }
  updateStatus();
  answerDelay=setTimeout(()=>{
    if(playing)nextQuestion();
  },1100);
}

/* タイピング */
function renderRoma(){
  if(!current)return;
  const target=pickSpelling(current.r,typed);
  const typedHtml=typed.split("").map(c=>`<span class="typed">${escapeHtml(c)}</span>`).join("");
  const rest=target.slice(typed.length);
  document.getElementById("roma").innerHTML=typedHtml+`<span class="untyped">${escapeHtml(rest)}</span>`;
}
function showMistake(key){
  const target=pickSpelling(current.r,typed);
  const before=target.slice(0,typed.length);
  const rest=target.slice(typed.length);
  document.getElementById("roma").innerHTML=
    before.split("").map(c=>`<span class="typed">${escapeHtml(c)}</span>`).join("")+
    `<span class="mistyped">${escapeHtml(key)}</span>`+
    `<span class="untyped">${escapeHtml(rest)}</span>`;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
window.addEventListener("keydown",e=>{
  if(!playing||paused||!current||gameType!=="typing")return;
  if(e.key.length!==1||!/^[a-z-]$/i.test(e.key))return;
  const key=e.key.toLowerCase();
  const candidates=acceptedSpellings(current.r);
  const possible=candidates.some(s=>s.startsWith(typed+key));
  if(possible){
    typed+=key;
    renderRoma();
    if(candidates.some(s=>s===typed)){
      score+=10;correct++;
      updateStatus();
      nextQuestion();
    }
  }else{
    miss++;
    updateStatus();
    showMistake(key);
    setTimeout(()=>{if(playing&&!paused&&gameType==="typing")renderRoma()},220);
  }
});

/* 地図 */
let atlas={ready:false};
let drawnMode=null,mapView=null,pinLayer=null;
const pinCache=new Map();
const isAomoriId=id=>String(id).padStart(5,"0").slice(0,2)==="02";
const idKey=(id,width)=>String(id).padStart(width,"0");

function groupById(features,width){
  const m=new Map();
  for(const f of features){
    const k=idKey(f.id,width);
    if(!m.has(k))m.set(k,[]);
    m.get(k).push(f);
  }
  return m;
}
async function loadMap(){
  try{
    mapData=await d3.json("https://unpkg.com/jpn-atlas@1/japan/japan.json");
    prepareAtlas();
    drawnMode=null;
    renderMap(playing&&current?current.id:null);
    document.getElementById("map-loading").style.display="none";
  }catch(err){
    console.error(err);
    document.getElementById("map-loading").textContent="地図を読み込めませんでした。インターネット接続を確認してください。";
  }
}
function prepareAtlas(){
  const o=mapData.objects;
  const prefs=topojson.feature(mapData,o.prefectures).features;
  const aomoriMuni=topojson.feature(mapData,o.municipalities).features.filter(f=>isAomoriId(f.id));
  atlas={
    ready:true,
    country:topojson.feature(mapData,o.country),
    prefMesh:topojson.mesh(mapData,o.prefectures,(a,b)=>a!==b),
    prefById:groupById(prefs,2),
    aomoriPref:prefs.find(f=>idKey(f.id,2)==="02")||null,
    aomoriMuni,
    aomoriById:groupById(aomoriMuni,5),
    aomoriMesh:topojson.mesh(mapData,o.municipalities,(a,b)=>a!==b&&String(a.id)!==String(b.id)&&isAomoriId(a.id)&&isAomoriId(b.id))
  };
  pinCache.clear();
}
function renderMap(highlightId=null){
  if(!mapData||!atlas.ready)return;
  if(drawnMode!==mode)drawBase();
  showPin(highlightId);
}
function drawBase(){
  const svg=d3.select("#map");
  svg.selectAll("*").remove();
  const path=d3.geoPath();
  const bounds=mode==="aomori"
    ?path.bounds({type:"FeatureCollection",features:atlas.aomoriMuni})
    :path.bounds(atlas.country);
  const w=Math.max(1,bounds[1][0]-bounds[0][0]);
  const h=Math.max(1,bounds[1][1]-bounds[0][1]);
  const padding=35;
  const scale=Math.min((850-padding*2)/w,(680-padding*2)/h);
  const tx=(850-scale*(bounds[0][0]+bounds[1][0]))/2;
  const ty=(680-scale*(bounds[0][1]+bounds[1][1]))/2;
  const group=svg.append("g").attr("transform",`translate(${tx},${ty}) scale(${scale})`);

  if(mode==="aomori"){
    group.selectAll("path.muni").data(atlas.aomoriMuni).join("path")
      .attr("class","map-bg muni").attr("d",path);
    group.append("path").datum(atlas.aomoriMesh).attr("class","muni-border").attr("d",path);
    if(atlas.aomoriPref)group.append("path").datum(atlas.aomoriPref).attr("class","pref-border").attr("d",path);
  }else{
    group.append("path").datum(atlas.country).attr("class","map-bg").attr("d",path);
    group.append("path").datum(atlas.prefMesh).attr("class","pref-border").attr("d",path);
  }
  pinLayer=group.append("g").attr("class","pin-layer");
  mapView={scale};
  drawnMode=mode;
}
function clearPin(){
  if(pinLayer)pinLayer.selectAll("*").remove();
}
function pinPosition(id){
  const key=mode+":"+id;
  if(pinCache.has(key))return pinCache.get(key);
  const width=mode==="aomori"?5:2;
  const feats=(mode==="aomori"?atlas.aomoriById:atlas.prefById).get(idKey(id,width));
  const pos=feats?pinPointOf(feats,0.5/mapView.scale):null;
  pinCache.set(key,pos);
  return pos;
}
function showPin(id){
  clearPin();
  if(!id||!pinLayer||!mapView)return;
  const c=pinPosition(id);
  if(!c)return;
  const pin=pinLayer.append("g")
    .attr("class","pin-svg")
    .attr("transform",`translate(${c[0]},${c[1]}) scale(${1/mapView.scale})`);
  pin.append("circle")
    .attr("cx",0).attr("cy",0).attr("r",6)
    .attr("fill","#ef4444").attr("stroke","#fff").attr("stroke-width",2);
  pin.append("circle")
    .attr("cx",0).attr("cy",0).attr("r",10)
    .attr("fill","none").attr("stroke","#ef4444").attr("stroke-width",2).attr("opacity",.25);
}
loadMap();
</script>
