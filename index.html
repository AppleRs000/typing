<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地名ヘボン式ローマ字タイピング</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ヘッダー・タブ切替 */
    .header-panel {
      position: absolute;
      top: 15px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }
    .tab-btn {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border: 2px solid #38bdf8;
      border-radius: 10px;
      background-color: transparent;
      color: #38bdf8;
      cursor: pointer;
    }
    .tab-btn.active {
      background-color: #38bdf8;
      color: #0f172a;
    }

    /* メインレイアウト（タイピング＋地図） */
    .main-wrapper {
      display: flex;
      gap: 20px;
      width: 95%;
      max-width: 1100px;
      align-items: center;
      justify-content: center;
    }

    /* タイピングエリア */
    .container {
      flex: 1;
      background: #1e293b;
      padding: 30px 20px;
      border-radius: 20px;
      border: 2px solid #334155;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
    }

    .kanji-display {
      font-size: clamp(28px, 5vw, 48px);
      font-weight: bold;
      color: #facc15;
      margin-bottom: 5px;
    }

    .kana-display {
      font-size: clamp(16px, 2.5vw, 20px);
      color: #94a3b8;
      margin-bottom: 15px;
    }

    .roma-display {
      font-size: clamp(28px, 5vw, 48px);
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      letter-spacing: 2px;
      background: #0f172a;
      padding: 12px 15px;
      border-radius: 12px;
      border: 2px solid #38bdf8;
      min-height: 75px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .typed { color: #4ade80; }
    .untyped { color: #ffffff; }
    .error { color: #f87171; text-decoration: underline; }

    .status-bar {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
      color: #cbd5e1;
    }

    /* 地図パネル */
    .map-panel {
      width: 320px;
      height: 320px;
      background: #0f172a;
      border-radius: 20px;
      border: 2px solid #38bdf8;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .map-bg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0.8;
    }

    /* ピンと矢印マーク */
    .map-pin {
      position: absolute;
      transform: translate(-50%, -100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      transition: all 0.3s ease;
    }
    .pin-arrow {
      font-size: 24px;
      color: #ef4444;
      animation: bounce 0.6s infinite alternate;
    }
    .pin-dot {
      width: 12px;
      height: 12px;
      background-color: #ef4444;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px #ef4444;
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }

    /* スタート・結果表示画面 */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }
    .overlay h1 {
      font-size: 36px;
      color: #38bdf8;
      margin-bottom: 10px;
    }
    
    .setting-group {
      margin: 15px 0 20px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: bold;
      color: #cbd5e1;
    }
    .setting-group select {
      font-size: 18px;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 8px;
      border: 2px solid #38bdf8;
      background: #0f172a;
      color: #ffffff;
      cursor: pointer;
    }

    .start-btn {
      padding: 14px 36px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background-color: #4ade80;
      color: #0f172a;
      cursor: pointer;
      box-shadow: 0 5px 0 #16a34a;
    }
    .start-btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    @media (max-width: 768px) {
      .main-wrapper {
        flex-direction: column;
      }
      .map-panel {
        width: 260px;
        height: 200px;
      }
    }
  </style>
</head>
<body>

  <!-- タブ切り替え -->
  <div class="header-panel">
    <button class="tab-btn active" id="tab1" onclick="switchMode('aomori')">🍎 青森県40市町村</button>
    <button class="tab-btn" id="tab2" onclick="switchMode('pref')">🗾 47都道府県</button>
  </div>

  <div class="main-wrapper">
    <!-- タイピングエリア -->
    <div class="container">
      <div class="kanji-display" id="kanji-text">---</div>
      <div class="kana-display" id="kana-text">---</div>
      <div class="roma-display" id="roma-text">---</div>

      <div class="status-bar">
        <div>スコア: <span id="score-val" style="color:#4ade80;">0</span></div>
        <div>残り時間: <span id="time-val" style="color:#facc15;">60</span>s</div>
      </div>
    </div>

    <!-- 地図パネル -->
    <div class="map-panel">
      <!-- 青森県SVG地図 -->
      <svg id="map-aomori" class="map-bg" viewBox="0 0 400 400" style="display: block;">
        <path d="M 160 50 Q 180 80 170 120 Q 150 140 180 200 Q 230 220 280 180 Q 320 120 300 80 Q 260 110 210 100 Q 190 60 160 50 Z" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
        <text x="200" y="380" fill="#64748b" font-size="14" text-anchor="middle">青森県マップ</text>
      </svg>
      <!-- 日本地図SVG -->
      <svg id="map-japan" class="map-bg" viewBox="0 0 400 400" style="display: none;">
        <path d="M 300 80 L 320 100 L 280 160 L 240 180 L 180 250 L 120 280 L 60 320" fill="none" stroke="#334155" stroke-width="24" stroke-linecap="round"/>
        <path d="M 300 80 L 320 100 L 280 160 L 240 180 L 180 250 L 120 280 L 60 320" fill="none" stroke="#38bdf8" stroke-width="2"/>
        <text x="200" y="380" fill="#64748b" font-size="14" text-anchor="middle">日本全国マップ</text>
      </svg>

      <!-- ピン位置表示 -->
      <div class="map-pin" id="map-pin" style="left: 50%; top: 50%; display: none;">
        <div class="pin-arrow">⬇</div>
        <div class="pin-dot"></div>
      </div>
    </div>
  </div>

  <!-- スタート／結果画面 -->
  <div class="overlay" id="overlay">
    <h1 id="overlay-title">地名ヘボン式タイピング</h1>
    <p id="overlay-msg" style="font-size: 18px; color: #cbd5e1;">持ち時間を選んでスタートしてください</p>

    <div class="setting-group">
      <label for="time-select">⏱ 持ち時間:</label>
      <select id="time-select">
        <option value="1">1 分</option>
        <option value="2">2 分</option>
        <option value="3">3 分</option>
        <option value="5">5 分</option>
      </select>
    </div>

    <button class="start-btn" onclick="startGame()">スタート！</button>
  </div>

  <script>

      { k: '新郷村', y: 'しんごうむら', r: 'shingo-mura', x: 62, y: 66 }
    ];

    // ② 47都道府県データ（位置パーセント: x, y）
    const prefData = [
      { k: '北海道', y: 'ほっかいどう', r: 'hokkaido', x: 78, y: 20 },
      { k: '青森県', y: 'あおもりけん', r: 'aomori', x: 70, y: 38 },

      { k: '山形県', y: 'やまがたけん', r: 'yamagata', x: 66, y: 50 },

      { k: '三重県', y: 'みえけん', r: 'mie', x: 49, y: 73 },
      { k: '滋賀県', y: 'しがけん', r: 'shiga', x: 47, y: 67 },
      { k: '京都府', y: 'きょうとふ', r: 'kyoto', x: 44, y: 66 },
      { k: '大阪府', y: 'おおさかふ', r: 'osaka', x: 43, y: 71 },
      { k: '兵庫県', y: 'ひょうごけん', r: 'hyogo', x: 39, y: 68 },
      { k: '奈良県', y: 'ならけん', r: 'nara', x: 45, y: 73 },
      { k: '和歌山県', y: 'わかやまけん', r: 'wakayama', x: 43, y: 78 },
      { k: '鳥取県', y: 'とっとりけん', r: 'tottori', x: 33, y: 66 },
      { k: '島根県', y: 'しまねけん', r: 'shimane', x: 27, y: 68 },
      { k: '岡山県', y: 'おかやまけん', r: 'okayama', x: 33, y: 71 },
      { k: '広島県', y: 'ひろしまけん', r: 'hiroshima', x: 27, y: 73 },
      { k: '山口県', y: 'やまぐちけん', r: 'yamaguchi', x: 21, y: 75 },
      { k: '徳島県', y: 'とくしまけん', r: 'tokushima', x: 35, y: 80 },
      { k: '香川県', y: 'かがわけん', r: 'kagawa', x: 33, y: 77 },
      { k: '愛媛県', y: 'えひめけん', r: 'ehime', x: 26, y: 80 },
      { k: '高知県', y: 'こうちけん', r: 'kochi', x: 28, y: 84 },
      { k: '福岡県', y: 'ふくおかけん', r: 'fukuoka', x: 17, y: 78 },
      { k: '佐賀県', y: 'さがけん', r: 'saga', x: 13, y: 80 },

      { k: '熊本県', y: 'くまもとけん', r: 'kumamoto', x: 15, y: 85 },
      { k: '大分県', y: 'おおいたけん', r: 'oita', x: 20, y: 82 },
      { k: '宮崎県', y: 'みやざきけん', r: 'miyazaki', x: 18, y: 89 },
      { k: '鹿児島県', y: 'かごしまけん', r: 'kagoshima', x: 13, y: 92 },
      { k: '沖縄県', y: 'おきなわけん', r: 'okinawa', x: 10, y: 30 }
    ];

    let currentMode = 'aomori';
    let currentList = [];
    let currentItem = null;
    let typedIndex = 0;
    let score = 0;
    let timeLeft = 60;
    let timer = null;
    let isPlaying = false;

    function switchMode(mode) {
      if (isPlaying) return;
      currentMode = mode;
      document.getElementById('tab1').classList.toggle('active', mode === 'aomori');
      document.getElementById('tab2').classList.toggle('active', mode === 'pref');
      
      document.getElementById('map-aomori').style.display = mode === 'aomori' ? 'block' : 'none';
      document.getElementById('map-japan').style.display = mode === 'pref' ? 'block' : 'none';
    }

    function startGame() {
      const selectedMinutes = parseInt(document.getElementById('time-select').value, 10);
      timeLeft = selectedMinutes * 60;

      currentList = currentMode === 'aomori' ? [...aomoriData] : [...prefData];
      score = 0;
      isPlaying = true;

      document.getElementById('score-val').textContent = score;
      document.getElementById('time-val').textContent = timeLeft;
      document.getElementById('overlay').style.display = 'none';

      nextQuestion();

      clearInterval(timer);
      timer = setInterval(() => {
        timeLeft--;
        document.getElementById('time-val').textContent = timeLeft;
        if (timeLeft <= 0) endGame();
      }, 1000);
    }

    function nextQuestion() {
      if (currentList.length === 0) {
        currentList = currentMode === 'aomori' ? [...aomoriData] : [...prefData];
      }
      const randIdx = Math.floor(Math.random() * currentList.length);
      currentItem = currentList.splice(randIdx, 1)[0];
      typedIndex = 0;

      document.getElementById('kanji-text').textContent = currentItem.k;
      document.getElementById('kana-text').textContent = currentItem.y;
      
      // ピンの位置設定
      const pin = document.getElementById('map-pin');
      pin.style.left = currentItem.x + '%';
      pin.style.top = currentItem.y + '%';
      pin.style.display = 'flex';

      renderRoma();
    }

    function renderRoma() {
      const target = currentItem.r;
      const typed = target.substring(0, typedIndex);
      const untyped = target.substring(typedIndex);

      document.getElementById('roma-text').innerHTML = 
        `<span class="typed">${typed}</span><span class="untyped">${untyped}</span>`;
    }

    window.addEventListener('keydown', (e) => {
      if (!isPlaying || !currentItem) return;

      const key = e.key.toLowerCase();
      const targetChar = currentItem.r[typedIndex].toLowerCase();

      if (key === targetChar) {
        typedIndex++;
        renderRoma();

        if (typedIndex === currentItem.r.length) {
          score += 10;
          document.getElementById('score-val').textContent = score;
          nextQuestion();
        }
      } else if (key.length === 1 && key >= 'a' && key <= 'z' || key === '-') {
        const target = currentItem.r;
        const typed = target.substring(0, typedIndex);
        const errChar = target[typedIndex];
        const untyped = target.substring(typedIndex + 1);

        document.getElementById('roma-text').innerHTML = 
          `<span class="typed">${typed}</span><span class="error">${errChar}</span><span class="untyped">${untyped}</span>`;
      }
    });

    function endGame() {
      isPlaying = false;
      clearInterval(timer);

      document.getElementById('overlay-title').textContent = 'タイムアップ！';
      document.getElementById('overlay-msg').textContent = `あなたのスコア: ${score}点`;
      document.getElementById('overlay').style.display = 'flex';
      document.getElementById('map-pin').style.display = 'none';
    }
  </script>
</body>
</html>
